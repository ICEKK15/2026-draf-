<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Picklehead Fantasy Draft Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .subtitle {
      opacity: .7;
      font-size: 12px;
      margin-top: 4px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 17px;
    }

    .setup {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      background: #111827;
      color: white;
      border: none;
      font-weight: 600;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button.danger {
      background: #dc2626;
    }

    .recommendation {
      border: 2px solid #111827;
      border-radius: 10px;
      padding: 14px;
      background: #f9fafb;
    }

    .recommendation .player {
      font-size: 22px;
      font-weight: 800;
    }

    .recommendation .reason {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 10px;
    }

    .tabs button {
      width: auto;
      white-space: nowrap;
      padding: 8px 12px;
    }

    .tabs button.active {
      background: #2563eb;
    }

    .player-row {
      display: grid;
      grid-template-columns: 45px 1fr 60px 70px 80px;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .rank {
      font-weight: 700;
      color: #6b7280;
    }

    .player-name {
      font-weight: 700;
    }

    .team {
      font-size: 11px;
      color: #6b7280;
    }

    .pos {
      font-weight: 700;
    }

    .value {
      font-weight: 800;
      text-align: right;
    }

    .draft-btn {
      padding: 7px;
      margin: 0;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 5px;
      background: #e5e7eb;
      margin-left: 5px;
    }

    .badge.qb {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge.rb {
      background: #dcfce7;
      color: #166534;
    }

    .badge.wr {
      background: #fef3c7;
      color: #92400e;
    }

    .badge.te {
      background: #f3e8ff;
      color: #7e22ce;
    }

    .needs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .need {
      padding: 6px 9px;
      background: #fee2e2;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .need.ok {
      background: #dcfce7;
      color: #166534;
    }

    .draft-history {
      max-height: 350px;
      overflow-y: auto;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .alert {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .alert.red {
      background: #fee2e2;
      color: #991b1b;
    }

    .alert.green {
      background: #dcfce7;
      color: #166534;
    }

    .alert.yellow {
      background: #fef3c7;
      color: #92400e;
    }

    @media(max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .setup {
        grid-template-columns: 1fr 1fr;
      }

      .player-row {
        grid-template-columns: 35px 1fr 45px 60px;
      }

      .player-row .team {
        display: none;
      }

      .player-row .draft-btn {
        grid-column: 4;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏈 Picklehead Fantasy Draft Assistant</h1>
  <div class="subtitle">
    Custom 2026 draft assistant • 12 teams • PPR • QB-completion scoring
  </div>
</header>

<div class="container">

  <!-- SETUP -->
  <div class="card">
    <h2>Draft Setup</h2>

    <div class="setup">

      <div>
        <label>Teams</label>
        <input id="teamCount" type="number" value="12" min="2" max="20">
      </div>

      <div>
        <label>Your Draft Position</label>
        <input id="myPosition" type="number" value="6" min="1" max="20">
      </div>

      <div>
        <label>Rounds</label>
        <input id="roundCount" type="number" value="18" min="1" max="30">
      </div>

    </div>

    <br>

    <button onclick="initializeDraft()">
      Start / Reset Draft
    </button>

    <br><br>

    <button class="secondary" onclick="undoPick()">
      Undo Last Pick
    </button>

    <button class="secondary" onclick="exportDraft()">
      Export Draft
    </button>

    <button class="secondary" onclick="importDraft()">
      Import Draft
    </button>

  </div>

  <br>

  <!-- CURRENT PICK -->
  <div class="grid">

    <div class="card">

      <h2>Current Pick</h2>

      <div id="currentPick"></div>

      <br>

      <div id="draftAlert"></div>

      <div id="recommendation" class="recommendation">
        Start the draft.
      </div>

    </div>

    <div class="card">

      <h2>Your Roster</h2>

      <div id="myRoster"></div>

      <br>

      <h3>Remaining Needs</h3>

      <div id="needs" class="needs"></div>

    </div>

  </div>

  <br>

  <!-- AVAILABLE PLAYERS -->
  <div class="card">

    <h2>Available Players</h2>

    <div class="tabs">

      <button class="active" onclick="setFilter('ALL', this)">
        ALL
      </button>

      <button onclick="setFilter('QB', this)">
        QB
      </button>

      <button onclick="setFilter('RB', this)">
        RB
      </button>

      <button onclick="setFilter('WR', this)">
        WR
      </button>

      <button onclick="setFilter('TE', this)">
        TE
      </button>

    </div>

    <input
      id="search"

      oninput="renderPlayers()"

    <br>

    <div id="playerList"></div>

  </div>

  <br>

  <!-- HISTORY -->
  <div class="card">

    <h2>Draft History</h2>

    <div id="history" class="draft-history"></div>

  </div>

</div>

let state = {
  teams: 12,
  myPosition: 6,
  rounds: 18,
  draftIndex: 0,
  drafted: [],
  history: [],
  filter: "ALL"
};

function initializeDraft() {

  state.teams =
    Number(document.getElementById("teamCount").value);

  state.myPosition =
    Number(document.getElementById("myPosition").value);

  state.rounds =
    Number(document.getElementById("roundCount").value);

  state.draftIndex = 0;
  state.drafted = [];
  state.history = [];

  render();
}

function snakeTeamAtPick(pickIndex) {

  const round =
    Math.floor(pickIndex / state.teams);

  const pos =
    pickIndex % state.teams;

  if (round % 2 === 0) {
    return pos + 1;
  }

  return state.teams - pos;
}

function currentPickNumber() {
  return state.draftIndex + 1;
}

function currentRound() {
  return Math.floor(state.draftIndex / state.teams) + 1;
}

function isMyPick() {
  return snakeTeamAtPick(state.draftIndex) === state.myPosition;
}

function draftPlayer(playerName) {

  const player =
    PLAYERS.find(p => p.name === playerName);

  if (!player) return;

  if (state.drafted.includes(playerName)) {
    return;
  }

  state.drafted.push(playerName);

  state.history.push({
    pick: currentPickNumber(),
    round: currentRound(),
    team: snakeTeamAtPick(state.draftIndex),
    player: playerName
  });

  state.draftIndex++;

  render();
}

function undoPick() {

  if (state.history.length === 0) return;

  const last =
    state.history.pop();

  state.drafted =
    state.drafted.filter(
      p => p !== last.player
    );

  state.draftIndex--;

  render();
}

function setFilter(filter, button) {

  state.filter = filter;

  document
    .querySelectorAll(".tabs button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  renderPlayers();
}

function availablePlayers() {

  return PLAYERS
    .filter(p => !state.drafted.includes(p.name))
    .filter(p =>
      state.filter === "ALL" ||
      p.pos === state.filter
    )
    .sort((a,b) => a.rank - b.rank);
}

function calculateRecommendation() {

  const available =
    PLAYERS.filter(
      p => !state.drafted.includes(p.name)
    );

  if (!available.length) {
    return null;
  }

  /*
  ---------------------------------------------------------
  DYNAMIC VALUE MODEL
  ---------------------------------------------------------

  Base player value
  + positional scarcity
  + roster need
  + upside
  + volume

  QB gets a major boost because:

  - OP can be QB
  - 1 point/completion
  - 12-team league
  - potentially 24 QB starters
  */

  const scores =
    available.map(player => {

      let score = player.value;

      const scarcity =
        calculateScarcity(player.pos);

      score += scarcity;

      const rosterNeed =
        calculateRosterNeed(player.pos);

      score += rosterNeed;

      /*
      QB-specific adjustment.
      */

      if (player.pos === "QB") {

        score += 8;

        /*
        If many teams don't have a QB,
        increase QB urgency.
        */

        const qbCount =
          state.history.filter(
            h =>
              PLAYERS.find(p => p.name === h.player)?.pos === "QB"
          ).length;

        if (qbCount >= 8) score += 8;
        if (qbCount >= 12) score += 12;
        if (qbCount >= 16) score += 16;
      }

      /*
      Don't force a position simply because
      it's scarce if your roster doesn't need it.
      */

      return {
        player,
        score
      };

    });

  scores.sort((a,b) => b.score - a.score);

  return scores[0];
}

function calculateScarcity(position) {

  const available =
    PLAYERS.filter(
      p =>
        p.pos === position &&
        !state.drafted.includes(p.name)
    );

  if (available.length <= 3) return 15;
  if (available.length <= 6) return 10;
  if (available.length <= 10) return 5;

  return 0;
}

function calculateRosterNeed(position) {

  const mine =
    state.history
      .filter(
        h =>
          h.team === state.myPosition
      )
      .map(h =>
        PLAYERS.find(p => p.name === h.player)
      )
      .filter(Boolean);

  const count =
    mine.filter(p => p.pos === position).length;

  /*
  Your mandatory starters:

  QB 1
  RB 2
  WR 2
  TE 1
  FLEX 1
  OP 1

  OP can be QB.

  Therefore QB has enormous importance.
  */

  if (position === "QB") {

    if (count === 0) return 12;
    if (count === 1) return 4;
    if (count === 2) return -4;

  }

  if (position === "RB") {

    if (count < 2) return 8;
    if (count === 2) return 3;

  }

  if (position === "WR") {

    if (count < 2) return 8;
    if (count === 2) return 3;

  }

  if (position === "TE") {

    if (count === 0) return 6;

  }

  return 0;
}

function renderRecommendation() {

  const box =
    document.getElementById("recommendation");

  if (!isMyPick()) {

    box.innerHTML = `
      <div class="player">
        Waiting for your pick...
      </div>
      <div class="reason">
        Track the other teams and watch for positional runs.
      </div>
    `;

    return;
  }

  const recommendation =
    calculateRecommendation();

  if (!recommendation) return;

  const p =
    recommendation.player;

  box.innerHTML = `
    <div style="font-size:11px;font-weight:700">
      RECOMMENDED PICK
    </div>

    <div class="player">
      ${p.name}
      <span class="badge ${p.pos.toLowerCase()}">
        ${p.pos}
      </span>
    </div>

    <div style="margin-top:5px">
      ${p.team} • Custom Rank #${p.rank}
    </div>

    <div class="reason">

      <strong>Draft Score: ${recommendation.score.toFixed(1)}</strong>

      <br><br>

      Upside: ${p.upside}/100<br>
      Floor: ${p.floor}/100<br>
      Workload: ${p.volume}/100<br>
      Risk: ${p.risk}/100

    </div>

    <br>

    <button onclick="draftPlayer('${p.name}')">
      DRAFT ${p.name.toUpperCase()}
    </button>
  `;
}

function renderPlayers() {

  const list =
    document.getElementById("playerList");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();

  let players =
    availablePlayers()
      .filter(p =>
        p.name.toLowerCase().includes(search)
      );

  list.innerHTML =
    players.map(p => `

      <div class="player-row">

        <div class="rank">
          ${p.rank}
        </div>

        <div>
          <div class="player-name">
            ${p.name}
          </div>

          <div class="team">
            ${p.team}
          </div>
        </div>

        <div class="pos">
          ${p.pos}
        </div>

        <div class="value">
          ${p.value}
        </div>

        <button
          class="draft-btn"
          onclick="draftPlayer('${p.name}')">
          Draft
        </button>

      </div>

    `).join("");
}

function renderCurrentPick() {

  const box =
    document.getElementById("currentPick");

  const team =
    snakeTeamAtPick(state.draftIndex);

  box.innerHTML = `

    <div style="font-size:28px;font-weight:800">
      Round ${currentRound()}
    </div>

    <div style="font-size:18px">
      Pick ${currentPickNumber()}
    </div>

    <br>

    <strong>
      ${team === state.myPosition
        ? "🔥 YOUR PICK"
        : `Team ${team}'s pick`}
    </strong>

  `;
}

function renderAlert() {

  const box =
    document.getElementById("draftAlert");

  const qbDrafted =
    state.history.filter(h => {

      const p =
        PLAYERS.find(
          x => x.name === h.player
        );

      return p && p.pos === "QB";

    }).length;

  if (qbDrafted >= 16) {

    box.innerHTML = `
      <div class="alert red">
        🚨 MAJOR QB SCARCITY — 16+ QBs drafted
      </div>
    `;

  } else if (qbDrafted >= 12) {

    box.innerHTML = `
      <div class="alert yellow">
        ⚠️ QB RUN — 12+ QBs drafted
      </div>
    `;

  } else {

    box.innerHTML = `
      <div class="alert green">
        QB market is still relatively healthy.
      </div>
    `;

  }
}

function renderRoster() {

  const mine =
    state.history
      .filter(
        h => h.team === state.myPosition
      );

  const box =
    document.getElementById("myRoster");

  if (!mine.length) {

    box.innerHTML =
      "<em>No players drafted yet.</em>";

    return;
  }

  box.innerHTML =
    mine.map(h => {

      const p =
        PLAYERS.find(
          x => x.name === h.player
        );

      return `
        <div class="history-row">
          <span>
            ${p.pos} — ${p.name}
          </span>
          <span>
            R${h.round}
          </span>
        </div>
      `;

    }).join("");
}

function renderNeeds() {

  const mine =
    state.history
      .filter(
        h => h.team === state.myPosition
      )
      .map(
        h =>
          PLAYERS.find(
            p => p.name === h.player
          )
      )
      .filter(Boolean);

  const counts = {
    QB: mine.filter(p => p.pos === "QB").length,
    RB: mine.filter(p => p.pos === "RB").length,
    WR: mine.filter(p => p.pos === "WR").length,
    TE: mine.filter(p => p.pos === "TE").length
  };

  const needs = [
    ["QB",1],
    ["RB",2],
    ["WR",2],
    ["TE",1]
  ];

  document.getElementById("needs").innerHTML =
    needs.map(([pos,target]) => {

      const ok =
        counts[pos] >= target;

      return `
        <div class="need ${ok ? "ok" : ""}">
          ${pos}: ${counts[pos]}/${target}
        </div>
      `;

    }).join("");
}

function renderHistory() {

  const box =
    document.getElementById("history");

  box.innerHTML =
    state.history
      .slice()
      .reverse()
      .map(h => `

        <div class="history-row">

          <span>
            #${h.pick}
            — Team ${h.team}
          </span>

          <strong>
            ${h.player}
          </strong>

        </div>

      `)
      .join("");
}

function render() {

  renderCurrentPick();
  renderAlert();
  renderRecommendation();
  renderPlayers();
  renderRoster();
  renderNeeds();
  renderHistory();

  localStorage.setItem(
    "pickleheadDraft",
    JSON.stringify(state)
  );
}

function exportDraft() {

  const data =
    JSON.stringify(state);

  navigator.clipboard.writeText(data);

  alert("Draft state copied to clipboard.");
}

function importDraft() {

  const data =
    prompt("Paste your exported draft state:");

  if (!data) return;

  try {

    state =
      JSON.parse(data);

    render();

  } catch {

    alert("Invalid draft data.");

  }
}
